<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pinky Web</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #16001f, #3b0750, #16001f);
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* LOGO CON TU IMAGEN */
    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff2222;
      box-shadow:
        0 0 20px #ff0000,
        0 0 50px #ff0000;
      display: block;
      margin: 0 auto 25px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .mensaje {
      font-size: 17px;
      margin-bottom: 30px;
    }

    .opciones {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 20px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.07);
      border: 2px solid #a90055;
      font-size: 19px;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px #ff0066;
    }

    .icono {
      font-size: 28px;
      margin-right: 15px;
    }

    footer {
      margin-top: 40px;
      color: #aaa;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- AQUÍ APARECE TU IMAGEN EN VEZ DE LA V -->
    <img src="logo.jpg" alt="Pinky Web" class="logo">

    <h1>PINKY WEB</h1>

    <div class="mensaje">
      🔥 Únete a mis comunidades 🔥
    </div>

    <div class="opciones">

      <a class="btn" href="#" target="_blank">
        <span class="icono">🟢</span>
        Canal de WhatsApp
      </a>

      <a class="btn" href="#" target="_blank">
        <span class="icono">👥</span>
        Grupo de WhatsApp
      </a>

      <a class="btn" href="#" target="_blank">
        <span class="icono">🔵</span>
        Telegram
      </a>

    </div>

    <footer>
      © 2026 Pinky Web
    </footer>

  </div>

</body>
</html>
