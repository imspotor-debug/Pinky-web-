<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POCOYÓXIT</title>
  <style>
    :root{
      --bg: #07090d;
      --bg-2: #10151d;
      --panel: #121922;
      --panel-2: #171f2a;
      --panel-3: #1d2734;
      --line: #233041;
      --line-soft: rgba(255,255,255,0.06);
      --text: #edf3ff;
      --muted: #9aa8bb;
      --red: #ff3b3b;
      --red-2: #d72828;
      --green: #27d17d;
      --green-soft: rgba(39, 209, 125, 0.12);
      --blue: #3b82f6;
      --blue-soft: rgba(59,130,246,0.12);
      --yellow: #f7c948;
      --shadow: rgba(0,0,0,0.35);
    }

    *{ box-sizing: border-box; }

    html, body{
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    body{
      min-height: 100vh;
    }

    a{
      color: inherit;
      text-decoration: none;
    }

    button, input, select{
      font: inherit;
    }

    .hidden{
      display: none !important;
    }

    .login-screen{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card{
      width: min(440px, 92vw);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      padding: 28px 24px;
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .brand-mark{
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--red), var(--red-2));
      color: white;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(255,59,59,0.45);
    }

    .brand-name{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .login-title{
      text-align: center;
      font-size: 12px;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .field{
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field label{
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input{
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text);
      outline: none;
      font-size: 15px;
    }

    .field input:focus{
      border-color: rgba(59,130,246,0.8);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    .login-actions{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn{
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .btn:hover{
      transform: translateY(-1px);
    }

    .btn.primary{
      background: linear-gradient(135deg, var(--red), var(--red-2));
      color: white;
      box-shadow: 0 12px 24px rgba(255,59,59,0.25);
    }

    .btn.secondary{
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .demo-info{
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .app{
      width: 100%;
      min-height: 100vh;
      background: #08080a;
    }

    .app-shell{
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh;
    }

    .sidebar{
      background: linear-gradient(180deg, rgba(17,21,29,0.96), rgba(12,16,22,0.98));
      border-right: 1px solid var(--line);
      padding: 22px 16px 18px;
      position: relative;
    }

    .sidebar .brand{
      justify-content: flex-start;
      padding: 8px 6px 18px;
      margin-bottom: 16px;
    }

    .nav{
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    .nav-item{
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--muted);
      border: 1px solid transparent;
      transition: 0.2s ease;
    }

    .nav-item:hover{
      background: rgba(255,255,255,0.02);
      border-color: var(--line-soft);
    }

    .nav-item.active{
      background: rgba(255,59,59,0.08);
      border-color: rgba(255,59,59,0.35);
      color: var(--text);
    }

    .dot{
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px rgba(255,59,59,0.75);
    }

    .sidebar-card{
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status{
      color: var(--green);
      font-weight: 700;
    }

    .main{
      padding: 26px;
    }

    .topbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .title{
      margin: 0;
      font-size: 34px;
      font-weight: 900;
    }

    .topbar-right{
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill{
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats{
      display: grid;
      grid-template-columns: repeat(4, minmax(170px, 1fr));
      gap: 18px;
      margin-bottom: 26px;
    }

    .stat-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: 0 18px 30px rgba(0,0,0,0.18);
    }

    .stat-label{
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .stat-value{
      margin-top: 12px;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
    }

    .red{ color: var(--red); }
    .green{ color: var(--green); }
    .blue{ color: var(--blue); }
    .yellow{ color: var(--yellow); }

    .dashboard-grid{
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 22px;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.18);
    }

    .panel-header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-title{
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .tag{
      background: rgba(255,59,59,0.08);
      border: 1px solid rgba(255,59,59,0.35);
      color: var(--red);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .form-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 16px;
    }

    .field-panel{
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-panel.full{
      grid-column: 1 / -1;
    }

    .field-panel label{
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field-panel input,
    .field-panel select{
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      padding: 13px 12px;
      outline: none;
      font-size: 15px;
    }

    .field-panel input:focus,
    .field-panel select:focus{
      border-color: rgba(59,130,246,0.8);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    .actions{
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .generated-box{
      margin-top: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    .small-label{
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .link-box{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.24);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      word-break: break-all;
    }

    .copy-btn{
      flex-shrink: 0;
      background: rgba(255,59,59,0.12);
      border: 1px solid rgba(255,59,59,0.38);
      color: var(--red);
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .ranking-table{
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th,
    .ranking-table td{
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .ranking-table th{
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .rank-pill{
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,59,59,0.08);
      border: 1px solid rgba(255,59,59,0.35);
      color: var(--red);
      font-weight: 800;
    }

    .up{ color: var(--green); font-weight: 700; }
    .down{ color: var(--red); font-weight: 700; }

    .list-table{
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .list-table th,
    .list-table td{
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .list-table th{
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .chip{
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      display: inline-block;
    }

    .active-chip{
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(39,209,125,0.28);
    }

    .pending-chip{
      background: rgba(247,201,73,0.12);
      color: var(--yellow);
      border: 1px solid rgba(247,201,73,0.25);
    }

    .summary-box{
      background: linear-gradient(180deg, rgba(59,130,246,0.08), rgba(255,255,255,0.01));
      border: 1px solid rgba(59,130,246,0.28);
      border-radius: 14px;
      padding: 16px;
      margin-top: 18px;
    }

    .summary-top{
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .summary-value{
      font-size: 28px;
      font-weight: 900;
      color: var(--blue);
    }

    .summary-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .mini-block{
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    .mini-block .label{
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .mini-block .amount{
      margin-top: 8px;
      font-size: 22px;
      font-weight: 800;
    }

    @media (max-width: 980px){
      .app-shell{
        grid-template-columns: 1fr;
      }

      .sidebar{
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .dashboard-grid{
        grid-template-columns: 1fr;
      }

      .stats{
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
    }

    @media (max-width: 620px){
      .main{
        padding: 18px;
      }

      .stats{
        grid-template-columns: 1fr;
      }

      .form-grid{
        grid-template-columns: 1fr;
      }

      .topbar{
        flex-direction: column;
        align-items: flex-start;
      }

      .link-box{
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

        <div class="brand-mark">P</div>
        <div class="brand-name">POCOYÓXIT</div>
      </div>
