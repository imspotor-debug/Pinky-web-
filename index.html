<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinky Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #16001f, #3b0750, #16001f);
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        /* IMAGEN EN LUGAR DE LA V */
        .logo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto 20px;
            border: 4px solid #ff4cff;
            box-shadow: 0 0 30px #ff00ff;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .mensaje {
            font-size: 17px;
            margin-bottom: 25px;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 17px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn:hover {
            transform: scale(1.03);
        }

        footer {
            margin-top: 35px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">

            <!-- AQUÍ APARECERÁ TU IMAGEN ROJA -->
            <img src="pinky.jpg" alt="Pinky Web" class="logo">

            <h1>PINKY WEB</h1>

            <p class="mensaje">
                🔥 Únete a mis comunidades 🔥
            </p>

        </div>

        <div class="opciones">

            <!-- CANAL DE WHATSAPP -->
            <a href="TU_LINK_DEL_CANAL"
               target="_blank"
               class="btn">
                📢 Canal de WhatsApp
            </a>

            <!-- GRUPO DE WHATSAPP -->
            <a href="TU_LINK_DEL_GRUPO"
               target="_blank"
               class="btn">
                👥 Grupo de WhatsApp
            </a>

            <!-- TELEGRAM -->
            <a href="TU_LINK_DE_TELEGRAM"
               target="_blank"
               class="btn">
                ✈️ Telegram
            </a>

        </div>

        <footer>
            © 2026 Pinky Web
        </footer>

    </div>

</body>
</html>
