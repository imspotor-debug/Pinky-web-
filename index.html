<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPO PROGRAMADOR OFC - Canales Oficiales</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0814;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: #160e26;
            padding: 30px 20px;
            border-radius: 20px;
            border: 2px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            text-align: center;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px #a855f7;
        }

        h1 {
            color: #c084fc;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.6);
        }

        p.description {
            font-size: 13px;
            color: #d8b4fe;
            margin-bottom: 25px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 25px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            background-color: transparent;
            border: 2px solid #a855f7;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .link-button i {
            font-size: 20px;
            color: #25d366; /* Mantiene el icono verde de WhatsApp */
            width: 24px;
            text-align: center;
        }

        .link-button span.text {
            flex-grow: 1;
            text-align: left;
            margin-left: 10px;
        }

        .link-button:hover {
            transform: translateY(-2px);
            background-color: rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 15px #a855f7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo CAPO PROGRAMADOR OFC" class="logo">
        </div>
        
        <h1>CAPO PROGRAMADOR OFC</h1>
        <p class="description">Bienvenido a mi comunidad. Únete a mis canales oficiales aquí abajo.</p>
        
        <div class="btn-list">
            <!-- Canal de WhatsApp 1 -->
            <a href="https://whatsapp.com/channel/0029VbDQaXj7Noa5g9ExjO1N" class="link-button" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span class="text">Canal de WhatsApp 1</span>
                <span>🟢</span>
            </a>

            <!-- Canal de WhatsApp 2 -->
            <a href="https://whatsapp.com/channel/0029VbDjbTrChq6R2goQjd2C" class="link-button" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span class="text">Canal de WhatsApp 2</span>
                <span>🟢</span>
            </a>
        </div>
    </div>

</body>
</html>
