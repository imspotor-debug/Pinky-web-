<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poco Yo a Cor</title>
  <style>
    :root {
      --bg: #0a0a0d;
      --bg2: #111116;
      --panel: #17171c;
      --panel-2: #1d1d23;
      --panel-3: #1a1a1f;
      --card: #141419;
      --line: #2a2a32;
      --red: #ff3737;
      --red-dark: #ca1d1d;
      --red-soft: rgba(255, 55, 55, 0.1);
      --text: #f4f4f5;
      --muted: #b7b7c0;
      --green: #2ad67d;
      --yellow: #ffcf5a;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #09090b 0%, #111116 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden { display: none !important; }

    .login-screen {
      width: min(420px, 92vw);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      padding: 28px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 0.7px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(255, 55, 55, 0.45);
      font-size: 22px;
      font-weight: bold;
    }

    .login-title {
      font-size: 12px;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    .field input:focus {
      border-color: rgba(255, 55, 55, 0.8);
      box-shadow: 0 0 0 3px rgba(255, 55, 55, 0.12);
    }

    .login-actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.primary {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: white;
      padding: 14px 18px;
      box-shadow: 0 12px 26px rgba(255,55,55,0.4);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 13px 16px;
    }

    .demo-info {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      background: #08080a;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: linear-gradient(180deg, #0d0d10 0%, #141419 100%);
      border-right: 1px solid var(--line);
      padding: 22px 16px;
    }

    .sidebar .brand {
      justify-content: flex-start;
      margin-bottom: 24px;
      font-size: 22px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      color: var(--muted);
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .menu-item.active {
      background: rgba(255, 55, 55, 0.08);
      border-color: rgba(255, 55, 55, 0.35);
      color: var(--text);
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.02);
      border-color: var(--line);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 14px rgba(255, 55, 55, 0.7);
    }

    .sidebar-footer {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .content {
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .topbar h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
    }

    .topbar .info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 16px 20px rgba(0,0,0
