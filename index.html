<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINKY MODZ - Canales Oficiales</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #161616;
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid #2a080c;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.15);
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 3px solid #ff0033;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
        }

        p.description {
            font-size: 14px;
            color: #bbbbbb;
            margin-bottom: 25px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        /* Colores de los botones */
        .btn-whatsapp {
            background-color: #25D366;
        }

        .btn-telegram {
            background-color: #0088cc;
        }

        .btn-youtube {
            background-color: #FF0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo cargado desde la misma carpeta con nombre logo.jpg -->
        <img src="logo.jpg" alt="PINKY MODZ Logo" class="logo">

        <!-- Título y Descripción -->
        <h1>PINKY MODZ</h1>
        <p class="description">Bienvenido a mi comunidad. Únete a mis redes oficiales aquí abajo.</p>

        <!-- Lista de Botones -->
        <div class="btn-list">
            <!-- Botón 1: WhatsApp -->
            <a href="https://whatsapp.com/channel/0029Vb7e1V2CMY0N0wdR9X1c" target="_blank" class="btn btn-whatsapp">
                💬 Canal de WhatsApp 🟢
            </a>

            <!-- Botón 2: Telegram -->
            <a href="https://t.me/linkjkrgds13exe" target="_blank" class="btn btn-telegram">
                📢 Canal de Telegram ✈️
            </a>

            <!-- Botón 3: YouTube -->
            <a href="https://youtube.com/@pinkymodz?si=k6QAKMaXQvWhw9lj" target="_blank" class="btn btn-youtube">
                ▶ Canal de YouTube 🔴
            </a>
        </div>
    </div>

</body>
</html>
